plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kotokompas.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kotokompas.app'
        minSdk 23
        targetSdk 34
        versionCode (project.findProperty('appVersionCode')?.toString()?.toInteger() ?: 1)
        versionName (project.findProperty('appVersionName')?.toString() ?: '1.0')
    }
}
